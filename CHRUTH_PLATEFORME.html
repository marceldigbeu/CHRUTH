<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CHRUTH — Plateforme de veille (HTML)</title>
<style>
  :root {
    --fond: #F5F8FA; --surface: #FFFFFF; --sidebar: #EDF4F3; --texte: #17212B;
    --secondaire: #586674; --faible: #8a97a5; --bordure: #D6E1E5; --regle: #e6edf0;
    --champ: #FFFFFF; --accent: #0F766E;
    --rouge: #b23b2e; --orange: #a9700a; --vert: #2b7a56;
    --public: #2f5c88; --prive: #855416;
    --mono: ui-monospace, "SFMono-Regular", "Cascadia Mono", Consolas, "Liberation Mono", monospace;
    font-synthesis: none;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fond: #08111F; --surface: #0d1826; --sidebar: #0C1727; --texte: #E7EEF7;
      --secondaire: #A7B5C7; --faible: #6c7d92; --bordure: #293B52; --regle: #1a293c;
      --champ: #15243A; --accent: #45D0BE;
      --rouge: #ef7c72; --orange: #dda553; --vert: #4fbf8f; --public: #83b2e2; --prive: #dcb066;
    }
  }
  :root[data-theme="light"] {
    --fond: #F5F8FA; --surface: #FFFFFF; --sidebar: #EDF4F3; --texte: #17212B;
    --secondaire: #586674; --faible: #8a97a5; --bordure: #D6E1E5; --regle: #e6edf0;
    --champ: #FFFFFF; --accent: #0F766E;
    --rouge: #b23b2e; --orange: #a9700a; --vert: #2b7a56; --public: #2f5c88; --prive: #855416;
  }
  :root[data-theme="dark"] {
    --fond: #08111F; --surface: #0d1826; --sidebar: #0C1727; --texte: #E7EEF7;
    --secondaire: #A7B5C7; --faible: #6c7d92; --bordure: #293B52; --regle: #1a293c;
    --champ: #15243A; --accent: #45D0BE;
    --rouge: #ef7c72; --orange: #dda553; --vert: #4fbf8f; --public: #83b2e2; --prive: #dcb066;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--fond); color: var(--texte);
    font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
    font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased;
  }
  .shell { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100vh; }

  /* Rail */
  .rail { background: var(--sidebar); border-right: 1px solid var(--bordure); padding: 24px 22px; }
  .wm { font-size: 15px; font-weight: 700; letter-spacing: .14em; }
  .wm i { color: var(--accent); font-style: normal; }
  .rail-sub { color: var(--faible); font-size: 11.5px; letter-spacing: .04em; margin-top: 2px; text-transform: uppercase; }
  .pages { list-style: none; margin: 26px 0 0; padding: 0; }
  .pages button {
    display: block; width: 100%; text-align: left; background: none; border: 0; cursor: pointer;
    padding: 6px 0; color: var(--secondaire); font: inherit; font-size: 14px;
  }
  .pages button:hover { color: var(--texte); }
  .pages button.actif { color: var(--texte); font-weight: 600; }
  .pages button.actif::before { content: "— "; color: var(--accent); }
  .pages button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .rail-foot { margin-top: 28px; padding-top: 18px; border-top: 1px solid var(--bordure); }
  .rail-foot h5 { margin: 0 0 8px; font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--faible); font-weight: 700; }
  .theme-line { display: flex; gap: 14px; font-size: 13.5px; }
  .theme-line button { background: none; border: 0; padding: 0 0 3px; font: inherit; color: var(--secondaire); cursor: pointer; border-bottom: 1.5px solid transparent; }
  .theme-line button[aria-pressed="true"] { color: var(--texte); border-bottom-color: var(--accent); }
  .theme-line button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  /* Corps */
  main { padding: 30px 40px 64px; max-width: 1000px; }
  .page { display: none; }
  .page.actif { display: block; }
  .kicker { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--faible); margin: 0 0 6px; }
  h1 { margin: 0 0 6px; font-size: 25px; font-weight: 650; letter-spacing: -.015em; }
  .intro { margin: 0 0 24px; color: var(--secondaire); font-size: 14px; max-width: 64ch; }
  .intro em { color: var(--accent); font-style: normal; }

  .barre { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; padding-bottom: 12px; margin-bottom: 4px; border-bottom: 2px solid var(--texte); }
  .tally { font-size: 13.5px; color: var(--secondaire); font-variant-numeric: tabular-nums; }
  .tally b { color: var(--texte); font-weight: 650; }
  .tally .pub { color: var(--public); } .tally .prv { color: var(--prive); }
  .filtre { margin-left: auto; display: flex; gap: 16px; font-size: 13px; }
  .filtre button, .lien-btn { background: none; border: 0; padding: 0 0 3px; font: inherit; cursor: pointer; color: var(--faible); border-bottom: 2px solid transparent; }
  .filtre button[aria-pressed="true"] { color: var(--texte); border-bottom-color: var(--accent); font-weight: 600; }
  .filtre button:focus-visible, .lien-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .check { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--secondaire); cursor: pointer; }

  /* Registre */
  .registre { display: flex; flex-direction: column; }
  .rec { display: grid; grid-template-columns: 74px minmax(0, 1fr) 176px; gap: 20px; padding: 18px 0; border-bottom: 1px solid var(--regle); }
  .rec:first-child { border-top: 1px solid var(--regle); }
  .rec.rejete { opacity: .58; }
  .prio { font-size: 12px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding-top: 2px; }
  .prio .sc { display: block; font-family: var(--mono); font-weight: 500; font-size: 12px; color: var(--faible); letter-spacing: 0; margin-top: 3px; }
  .prio.chaud { color: var(--rouge); } .prio.tiede { color: var(--orange); } .prio.froid { color: var(--faible); }
  .rec h3 { margin: 0; font-size: 16.5px; font-weight: 600; line-height: 1.3; letter-spacing: -.005em; }
  .rec h3 .neuf { color: var(--accent); font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; vertical-align: 2px; margin-right: 7px; }
  .ach { color: var(--secondaire); font-size: 14px; margin: 4px 0 0; }
  .ref { font-family: var(--mono); font-size: 12px; color: var(--faible); margin: 8px 0 0; letter-spacing: .01em; display: flex; flex-wrap: wrap; gap: 4px 14px; }
  .ref .src-joue { color: var(--public); font-weight: 600; }
  .verdict { font-size: 13px; color: var(--secondaire); margin: 9px 0 0; }
  .verdict b.oui { color: var(--vert); } .verdict b.non { color: var(--rouge); }
  .verdict .via { color: var(--faible); }
  .actions { display: flex; flex-wrap: wrap; gap: 6px 8px; margin-top: 11px; align-items: center; }
  .type { text-align: right; padding-top: 2px; }
  .type .t { font-size: 13px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; }
  .type.public .t { color: var(--public); } .type.prive .t { color: var(--prive); }
  .type .sous { display: block; font-size: 12.5px; color: var(--secondaire); margin-top: 3px; }
  .type .perso { display: inline-block; margin-top: 8px; font-size: 11px; letter-spacing: .05em; text-transform: uppercase; color: var(--faible); border: 1px solid var(--bordure); padding: 1px 7px; }

  /* Boutons d'action */
  .btn { font: inherit; font-size: 12.5px; padding: 4px 11px; border: 1px solid var(--bordure); background: var(--surface); color: var(--secondaire); cursor: pointer; border-radius: 2px; }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn.on-oui { border-color: var(--vert); color: var(--vert); }
  .btn.on-non { border-color: var(--rouge); color: var(--rouge); }
  .btn.primaire { background: var(--accent); border-color: var(--accent); color: #05231f; font-weight: 600; }
  :root[data-theme="dark"] .btn.primaire { color: #05231f; }
  select.mini, input.champ, textarea.champ, select.champ {
    font: inherit; font-size: 13.5px; padding: 5px 8px; border: 1px solid var(--bordure);
    background: var(--champ); color: var(--texte); border-radius: 2px;
  }
  select.mini { font-size: 12.5px; padding: 3px 6px; }
  textarea.champ { width: 100%; resize: vertical; line-height: 1.5; }
  input.champ, select.champ { width: 100%; }

  /* Tables (Base, CRM) */
  table.reg { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  table.reg th, table.reg td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--regle); vertical-align: top; }
  table.reg th { font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--faible); font-weight: 700; border-bottom: 2px solid var(--texte); }
  table.reg td.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .tbtype-public { color: var(--public); font-weight: 600; }
  .tbtype-prive { color: var(--prive); font-weight: 600; }
  .tblwrap { overflow-x: auto; }

  /* KPI en liste réglée (pas de tuiles) */
  dl.kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 0 40px; margin: 0; }
  dl.kpis > div { display: flex; justify-content: space-between; align-items: baseline; padding: 12px 0; border-bottom: 1px solid var(--regle); }
  dl.kpis dt { color: var(--secondaire); font-size: 14px; }
  dl.kpis dd { margin: 0; font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }

  /* Formulaires */
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 18px; margin-bottom: 14px; }
  .fld { display: flex; flex-direction: column; gap: 5px; }
  .fld label { font-size: 12.5px; color: var(--secondaire); }
  .full { grid-column: 1 / -1; }
  .section { margin-top: 34px; padding-top: 22px; border-top: 1px solid var(--bordure); }
  .section:first-of-type { margin-top: 24px; border-top: 0; padding-top: 0; }
  h2 { font-size: 17px; font-weight: 650; margin: 0 0 4px; }
  .aide { color: var(--secondaire); font-size: 13px; margin: 0 0 14px; max-width: 62ch; }
  .switch-row { display: flex; align-items: center; justify-content: space-between; padding: 11px 0; border-bottom: 1px solid var(--regle); }
  .switch-row .lib { font-size: 14px; } .switch-row .lib small { display: block; color: var(--faible); font-size: 12.5px; }
  .etat-oui { color: var(--vert); font-weight: 600; } .etat-non { color: var(--rouge); font-weight: 600; }
  .toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--texte); color: var(--fond); font-size: 13.5px; padding: 9px 18px; border-radius: 3px; opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 20; }
  .toast.show { opacity: 1; }
  .note-page { background: var(--surface); border: 1px solid var(--bordure); border-left: 3px solid var(--accent); padding: 16px 18px; font-size: 14px; color: var(--secondaire); }
  .note-page b { color: var(--texte); }
  .log { font-family: var(--mono); font-size: 12.5px; background: var(--sidebar); border: 1px solid var(--bordure); padding: 12px 14px; margin-top: 14px; white-space: pre-wrap; color: var(--secondaire); min-height: 80px; }
  .vide { color: var(--secondaire); font-style: italic; padding: 30px 0; }

  footer { margin-top: 40px; padding-top: 18px; border-top: 1px solid var(--bordure); color: var(--faible); font-size: 12.5px; line-height: 1.65; max-width: 76ch; }
  footer b { color: var(--secondaire); } footer .j { color: var(--public); }

  @media (max-width: 860px) {
    .shell { grid-template-columns: 1fr; }
    .rail { border-right: 0; border-bottom: 1px solid var(--bordure); }
    .pages { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0 20px; }
    main { padding: 24px 20px 52px; }
    .rec { grid-template-columns: 60px minmax(0, 1fr); }
    .type { grid-column: 1 / -1; text-align: left; padding-left: 80px; margin-top: -4px; }
    .form-grid, dl.kpis { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="shell">
  <aside class="rail">
    <div class="wm">CHR<i>U</i>TH</div>
    <div class="rail-sub">Veille &amp; prospection</div>
    <ul class="pages" id="nav"></ul>
    <div class="rail-foot">
      <h5>Affichage</h5>
      <div class="theme-line" role="group" aria-label="Thème">
        <button id="th-jour" aria-pressed="true">Jour</button>
        <button id="th-nuit" aria-pressed="false">Nuit</button>
      </div>
    </div>
  </aside>
  <main id="main"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  "use strict";
  var root = document.documentElement;
  var CLE = "chruth_html_v1";

  // ---------- Données d'exemple ----------
  var AOS = [
    { id:"MX-1", objet:"Nettoyage des locaux administratifs et vitrerie", acheteur:"Mairie de Créteil", ville:"Créteil", dept:"94", source:"BOAMP", ref:"26-104829", procedure:"MAPA", publie:"22.07", limite:"28.09.2026", prio:"chaud", score:72, buyer:"public", sous:"Collectivité territoriale", perso:false, verdict:"PERTINENT", via:"mot-clé « nettoyage »", etage:"tri déterministe", neuf:true },
    { id:"MX-2", objet:"Entretien des parties communes et remise en état", acheteur:"Immobilière 3F", ville:"Bobigny", dept:"93", source:"BOAMP", ref:"26-104701", procedure:"Appel d'offres ouvert", publie:"21.07", limite:"15.09.2026", prio:"chaud", score:68, buyer:"prive", sous:"Bailleur social · ESH", perso:false, verdict:"PERTINENT", via:"mot-clé « entretien des locaux »", etage:"tri déterministe", neuf:true },
    { id:"MX-3", objet:"Bionettoyage des blocs et locaux de soins", acheteur:"Centre Hospitalier Sud Francilien", ville:"Corbeil-Essonnes", dept:"91", source:"Maximilien", ref:"2026-CHSF-118", procedure:"Accord-cadre", publie:"20.07", limite:"30.09.2026", prio:"chaud", score:75, buyer:"public", sous:"Établissement hospitalier", perso:false, verdict:"PERTINENT", via:"mot-clé « bionettoyage »", etage:"tri déterministe", neuf:true },
    { id:"MX-4", objet:"Nettoyage de bureaux et locaux des services de l'État", acheteur:"Préfecture de la Région Île-de-France", ville:"Paris", dept:"75", source:"JOUE", ref:"2026-OJ-441207", procedure:"Procédure ouverte UE", publie:"18.07", limite:"06.10.2026", prio:"chaud", score:70, buyer:"public", sous:"Service de l'État", perso:false, verdict:"PERTINENT", via:"entretien courant de locaux", etage:"arbitrage IA", neuf:false },
    { id:"MX-5", objet:"Propreté des espaces d'accueil et sanitaires", acheteur:"SEM d'aménagement des Hauts-de-Seine", ville:"Nanterre", dept:"92", source:"Maximilien", ref:"2026-SEM92-063", procedure:"MAPA", publie:"16.07", limite:"22.09.2026", prio:"tiede", score:54, buyer:"prive", sous:"Société d'économie mixte", perso:false, verdict:"PERTINENT", via:"mot-clé « propreté »", etage:"tri déterministe", neuf:false },
    { id:"MX-6", objet:"Mise à disposition d'agents de service pour l'entretien", acheteur:"Ville d'Antony", ville:"Antony", dept:"92", source:"Maximilien", ref:"2026-ANT-207", procedure:"Accord-cadre", publie:"15.07", limite:"19.09.2026", prio:"tiede", score:50, buyer:"public", sous:"Collectivité territoriale", perso:true, verdict:"PERTINENT", via:"marché de personnel « mise à disposition »", etage:"tri déterministe", neuf:false },
    { id:"MX-7", objet:"Maintenance des ascenseurs et monte-charges", acheteur:"Département de Seine-Saint-Denis", ville:"Bobigny", dept:"93", source:"BOAMP", ref:"26-103980", procedure:"Appel d'offres ouvert", publie:"14.07", limite:"12.09.2026", prio:"froid", score:0, buyer:"public", sous:"Collectivité territoriale", perso:false, verdict:"REJETE", via:"exclusion métier « ascenseur »", etage:"tri déterministe", neuf:false },
    { id:"MX-8", objet:"Entretien des espaces verts et élagage", acheteur:"Grand Paris Sud", ville:"Évry", dept:"91", source:"Maximilien", ref:"2026-GPS-441", procedure:"MAPA", publie:"12.07", limite:"08.09.2026", prio:"froid", score:0, buyer:"public", sous:"Établissement public territorial", perso:false, verdict:"REJETE", via:"exclusion métier « espaces verts »", etage:"tri déterministe", neuf:false }
  ];

  var LIB_SUIVI = { nouveau:"Nouveau", a_traiter:"À traiter", repondu:"Répondu", abandonne:"Abandonné" };

  // ---------- État persistant ----------
  var defaut = {
    theme: null, page: "veille",
    ov: {}, // id -> {correction, lu, suivi}
    reglages: { notifications:true, collecte:true, rh:true,
      destinataires:["soniakengni@chruth.fr","marceldigbeu45@gmail.com"],
      fiche:"CHRUTH — nettoyage et propreté de locaux en Île-de-France. Entretien courant, vitrerie, bionettoyage, remise en état. Mise à disposition de personnel de service." },
    crm: []
  };
  var S;
  try { S = Object.assign({}, defaut, JSON.parse(localStorage.getItem(CLE) || "{}")); }
  catch (e) { S = Object.assign({}, defaut); }
  S.reglages = Object.assign({}, defaut.reglages, S.reglages || {});
  function save() { try { localStorage.setItem(CLE, JSON.stringify(S)); } catch (e) {} }
  function ov(id) { return S.ov[id] || (S.ov[id] = {}); }
  function verdictEff(a) { var o = S.ov[a.id]; return (o && o.correction) ? o.correction : a.verdict; }

  var toastT;
  function toast(msg) {
    var t = document.getElementById("toast");
    t.textContent = msg; t.classList.add("show");
    clearTimeout(toastT); toastT = setTimeout(function () { t.classList.remove("show"); }, 2200);
  }

  // ---------- Thème ----------
  var bJour = document.getElementById("th-jour"), bNuit = document.getElementById("th-nuit");
  function prefNuit() { return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches; }
  function applTheme(n) {
    root.setAttribute("data-theme", n ? "dark" : "light");
    bNuit.setAttribute("aria-pressed", String(n)); bJour.setAttribute("aria-pressed", String(!n));
    S.theme = n ? "dark" : "light"; save();
  }
  applTheme(S.theme ? S.theme === "dark" : prefNuit());
  bJour.onclick = function () { applTheme(false); };
  bNuit.onclick = function () { applTheme(true); };

  // ---------- Navigation ----------
  var PAGES = [
    { id:"veille", t:"Veille appels d'offres" },
    { id:"collecte", t:"Collecte" },
    { id:"base", t:"Base de données" },
    { id:"acheteurs", t:"Acheteurs de la semaine" },
    { id:"carte", t:"Carte" },
    { id:"messages", t:"Messages et CRM" },
    { id:"pilotage", t:"Pilotage" },
    { id:"dev", t:"Développeur" },
    { id:"reglages", t:"Réglages" }
  ];
  var nav = document.getElementById("nav");
  PAGES.forEach(function (p) {
    var li = document.createElement("li");
    var b = document.createElement("button");
    b.textContent = p.t; b.dataset.p = p.id;
    b.onclick = function () { aller(p.id); };
    li.appendChild(b); nav.appendChild(li);
  });
  function aller(id) {
    S.page = id; save();
    Array.prototype.forEach.call(nav.querySelectorAll("button"), function (b) {
      b.classList.toggle("actif", b.dataset.p === id);
    });
    render();
  }

  // ---------- Rendu ----------
  var main = document.getElementById("main");
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;" })[c]; }); }

  function render() {
    var id = S.page;
    if (id === "veille") return renderVeille();
    if (id === "base") return renderBase();
    if (id === "messages") return renderMessages();
    if (id === "pilotage") return renderPilotage();
    if (id === "reglages") return renderReglages();
    if (id === "collecte") return renderCollecte();
    if (id === "acheteurs") return renderAcheteurs();
    if (id === "carte") return renderInfo("Carte", "La carte interactive des prospects (132 000 sociétés géolocalisées) est produite par le pipeline Python dans <b>output/Carte_Prospects_CHRUTH.html</b>. Elle ne peut pas être embarquée ici : ce fichier reste une interface, pas un moteur de données.");
    if (id === "dev") return renderInfo("Développeur", "Le cockpit Excel <b>output/AO_CHRUTH.xlsm</b> et sa macro « Mettre à jour » vivent sur le poste. Cette page, côté Python, sert à l'inspecter et à relancer sa mise à jour après fermeture d'Excel.");
  }

  // Veille
  var vFiltre = "tous", vRejetes = false;
  function renderVeille() {
    var vis = AOS.filter(function (a) {
      var vd = verdictEff(a);
      if (!vRejetes && vd === "REJETE") return false;
      if (vFiltre !== "tous" && a.buyer !== vFiltre) return false;
      return true;
    });
    var pub = vis.filter(function (a) { return a.buyer === "public"; }).length;
    var prv = vis.length - pub;
    var chaud = vis.filter(function (a) { return a.prio === "chaud"; }).length;

    var h = '<div class="page actif"><p class="kicker">Registre · veille en continu</p>' +
      '<h1>Veille appels d\'offres</h1>' +
      '<p class="intro">Les marchés de propreté d\'Île-de-France, triés par pertinence et classés par <em>type d\'acheteur</em>. Marque un avis pertinent ou non : ton jugement est mémorisé (localStorage) et l\'emporte sur le tri.</p>' +
      '<div class="barre"><span class="tally"><b>' + vis.length + '</b> avis · <span class="pub"><b>' + pub + '</b> publics</span> · <span class="prv"><b>' + prv + '</b> privé-droit</span> · <b>' + chaud + '</b> chauds</span>' +
      '<span class="filtre" role="group" aria-label="Type d\'acheteur">' +
        fbtn("tous","Tous",vFiltre) + fbtn("public","Public",vFiltre) + fbtn("prive","Privé-droit",vFiltre) +
        '<label class="check"><input type="checkbox" id="vr"' + (vRejetes ? " checked" : "") + '> rejetés</label>' +
      '</span></div><div class="registre">';

    if (!vis.length) h += '<p class="vide">Aucun avis ne correspond au filtre.</p>';
    vis.forEach(function (a) { h += recHTML(a); });
    h += '</div>' + footVeille() + '</div>';
    main.innerHTML = h;

    document.getElementById("vr").onchange = function (e) { vRejetes = e.target.checked; renderVeille(); };
    Array.prototype.forEach.call(main.querySelectorAll(".filtre button"), function (b) {
      b.onclick = function () { vFiltre = b.dataset.f; renderVeille(); };
    });
    bindRecActions();
  }
  function fbtn(f, lib, cur) { return '<button data-f="' + f + '" aria-pressed="' + (cur === f) + '">' + lib + '</button>'; }
  function recHTML(a) {
    var o = S.ov[a.id] || {}, vd = verdictEff(a);
    var lu = !!o.lu, suivi = o.suivi || "nouveau";
    var prioLib = a.prio === "chaud" ? "Chaud" : a.prio === "tiede" ? "Tiède" : "Froid";
    var src = a.source === "JOUE" ? '<span class="src-joue">JOUE / TED</span>' : '<span>' + a.source + '</span>';
    var oui = vd === "PERTINENT";
    return '<article class="rec ' + (vd === "REJETE" ? "rejete" : "") + '" data-id="' + a.id + '">' +
      '<div class="prio ' + a.prio + '">' + prioLib + (a.score ? '<span class="sc">' + a.score + '</span>' : '') + '</div>' +
      '<div><h3>' + (a.neuf && !lu ? '<span class="neuf">Nouveau</span>' : '') + esc(a.objet) + '</h3>' +
      '<p class="ach">' + esc(a.acheteur) + ' · ' + esc(a.ville) + ' (' + a.dept + ')</p>' +
      '<p class="ref">' + src + '<span>réf. ' + a.ref + '</span><span>' + esc(a.procedure) + '</span><span>publié ' + a.publie + '</span><span>limite ' + a.limite + '</span></p>' +
      '<p class="verdict"><b class="' + (oui ? "oui" : "non") + '">' + (oui ? "Pertinent" : "Rejeté") + '</b> — ' + esc(a.via) + ' <span class="via">· ' + (o.correction ? "corrigé à la main" : a.etage) + '</span></p>' +
      '<div class="actions">' +
        '<button class="btn' + (vd === "PERTINENT" && o.correction ? " on-oui" : "") + '" data-a="oui">Pertinent</button>' +
        '<button class="btn' + (vd === "REJETE" && o.correction ? " on-non" : "") + '" data-a="non">Pas pertinent</button>' +
        '<button class="btn" data-a="lu">' + (lu ? "Marquer non lu" : "Marquer lu") + '</button>' +
        '<select class="mini" data-a="suivi" aria-label="Suivi">' +
          Object.keys(LIB_SUIVI).map(function (k) { return '<option value="' + k + '"' + (k === suivi ? " selected" : "") + '>' + LIB_SUIVI[k] + '</option>'; }).join("") +
        '</select></div></div>' +
      '<div class="type ' + a.buyer + '"><span class="t">' + (a.buyer === "public" ? "Public" : "Privé-droit") + '</span>' +
        '<span class="sous">' + esc(a.sous) + '</span>' + (a.perso ? '<span class="perso">Personnel</span>' : '') + '</div></article>';
  }
  function bindRecActions() {
    Array.prototype.forEach.call(main.querySelectorAll(".rec"), function (rec) {
      var id = rec.dataset.id;
      rec.querySelector('[data-a="oui"]').onclick = function () { ov(id).correction = "PERTINENT"; save(); toast("Marqué pertinent"); renderVeille(); };
      rec.querySelector('[data-a="non"]').onclick = function () { ov(id).correction = "REJETE"; save(); toast("Marqué non pertinent"); renderVeille(); };
      rec.querySelector('[data-a="lu"]').onclick = function () { var o = ov(id); o.lu = !o.lu; save(); renderVeille(); };
      rec.querySelector('[data-a="suivi"]').onchange = function (e) { ov(id).suivi = e.target.value; save(); toast("Suivi : " + LIB_SUIVI[e.target.value]); };
    });
  }
  function footVeille() {
    return '<footer><b>Interface HTML autonome.</b> La navigation, le filtrage, le marquage, les réglages et le CRM fonctionnent ici et sont mémorisés dans le navigateur. La collecte réelle (BOAMP, Maximilien, <span class="j">JOUE</span>), la génération par IA et la synchronisation GitHub restent assurées par l\'application Python.</footer>';
  }

  // Base de données
  var qBase = "";
  function renderBase() {
    var q = qBase.trim().toLowerCase();
    var rows = AOS.filter(function (a) {
      return !q || (a.objet + " " + a.acheteur + " " + a.ville + " " + a.sous).toLowerCase().indexOf(q) >= 0;
    });
    var h = '<div class="page actif"><p class="kicker">Base · tous les avis collectés</p><h1>Base de données</h1>' +
      '<p class="intro">Tous les avis en base, filtrés et rejetés compris, avec leur classification. Recherche plein texte sur l\'objet, l\'acheteur, la ville, le type.</p>' +
      '<div class="fld" style="max-width:340px;margin-bottom:16px"><input class="champ" id="qb" placeholder="Rechercher…" value="' + esc(qBase) + '"></div>' +
      '<div class="tblwrap"><table class="reg"><thead><tr><th>Objet</th><th>Acheteur</th><th>Type</th><th>Source</th><th>Prio</th><th>Verdict</th></tr></thead><tbody>';
    if (!rows.length) h += '<tr><td colspan="6" class="vide">Aucun résultat.</td></tr>';
    rows.forEach(function (a) {
      var vd = verdictEff(a);
      h += '<tr><td>' + esc(a.objet) + '</td><td>' + esc(a.acheteur) + ' <span style="color:var(--faible)">(' + a.dept + ')</span></td>' +
        '<td class="tbtype-' + a.buyer + '">' + (a.buyer === "public" ? "Public" : "Privé-droit") + '<br><span style="color:var(--faible);font-weight:400">' + esc(a.sous) + '</span></td>' +
        '<td>' + a.source + '</td><td class="num">' + (a.score || "—") + '</td>' +
        '<td style="color:' + (vd === "PERTINENT" ? "var(--vert)" : "var(--rouge)") + ';font-weight:600">' + (vd === "PERTINENT" ? "Pertinent" : "Rejeté") + '</td></tr>';
    });
    h += '</tbody></table></div></div>';
    main.innerHTML = h;
    var qb = document.getElementById("qb");
    qb.oninput = function (e) { qBase = e.target.value; var p = qb.selectionStart; renderBase(); var n = document.getElementById("qb"); n.focus(); n.setSelectionRange(p, p); };
  }

  // Messages et CRM
  var msgSel = AOS[0].id;
  function renderMessages() {
    var h = '<div class="page actif"><p class="kicker">Rédaction &amp; suivi commercial</p><h1>Messages et CRM</h1>' +
      '<div class="section"><h2>Message pour un appel d\'offres</h2>' +
      '<p class="aide">Choisis un avis : un brouillon d\'email et un script d\'appel sont composés à partir de gabarits (ici sans IA — l\'application Python appelle un vrai modèle). Édite librement, puis copie.</p>' +
      '<div class="fld" style="max-width:520px;margin-bottom:12px"><label>Appel d\'offres</label><select class="champ" id="msgao">' +
        AOS.filter(function (a) { return verdictEff(a) === "PERTINENT"; }).map(function (a) { return '<option value="' + a.id + '"' + (a.id === msgSel ? " selected" : "") + '>[' + a.prio.toUpperCase() + '] ' + esc(a.objet.slice(0, 60)) + ' — ' + esc(a.acheteur) + '</option>'; }).join("") +
      '</select></div>' +
      '<button class="btn primaire" id="gen">Composer le message</button>' +
      '<div id="msgout"></div></div>' +
      crmHTML() + '</div>';
    main.innerHTML = h;
    document.getElementById("msgao").onchange = function (e) { msgSel = e.target.value; };
    document.getElementById("gen").onclick = function () { composer(); };
    bindCRM();
  }
  function composer() {
    var a = AOS.filter(function (x) { return x.id === msgSel; })[0]; if (!a) return;
    var email = "Objet : Réponse à votre consultation — " + a.objet + "\n\n" +
      "À l'attention de " + a.acheteur + ",\n\n" +
      "Spécialisée dans le nettoyage et la propreté de locaux en Île-de-France, notre entreprise CHRUTH souhaite répondre à votre consultation « " + a.objet + " » (" + a.ville + ", " + a.dept + ").\n\n" +
      "Nous assurons l'entretien courant, la vitrerie et la remise en état de locaux, avec une équipe formée et un suivi qualité régulier. Nous serions honorés de vous adresser une offre adaptée à votre cahier des charges.\n\n" +
      "Dans l'attente de votre retour,\nL'équipe CHRUTH";
    var script = "Bonjour, je me présente, [votre nom] de CHRUTH, spécialisée en propreté de locaux en Île-de-France. " +
      "Nous avons vu votre consultation « " + a.objet + " » pour " + a.acheteur + ". " +
      "Puis-je vous poser deux questions sur le périmètre et la date limite (" + a.limite + ") afin d'ajuster notre offre ?";
    var out = document.getElementById("msgout");
    out.innerHTML = '<p class="aide" style="margin-top:16px">Source : <b style="color:var(--secondaire)">gabarit</b> (déterministe, hors IA).</p>' +
      '<div class="fld full" style="margin-bottom:12px"><label>Email (éditable)</label><textarea class="champ" rows="10">' + esc(email) + '</textarea></div>' +
      '<div class="fld full"><label>Script d\'appel</label><textarea class="champ" rows="4">' + esc(script) + '</textarea></div>';
  }
  function crmHTML() {
    var rows = S.crm.map(function (c, i) {
      return '<tr><td>' + esc(c.societe) + '</td><td>' + esc(c.statut) + '</td><td class="num">' + (c.montant ? esc(c.montant) + " €" : "—") + '</td><td><button class="lien-btn" data-del="' + i + '" style="color:var(--rouge)">retirer</button></td></tr>';
    }).join("");
    var STAT = ["Prospect contacté","Devis envoyé","Gagné","Perdu","Client actif","Client perdu"];
    return '<div class="section"><h2>CRM — suivi commercial</h2><p class="aide">Enregistre le suivi réel (contact, devis, contrat). Mémorisé dans le navigateur ; sur le poste, le pipeline alimente l\'analyse de rentabilité.</p>' +
      '<div class="form-grid"><div class="fld"><label>Société</label><input class="champ" id="c-soc"></div>' +
      '<div class="fld"><label>Statut</label><select class="champ" id="c-stat">' + STAT.map(function (s) { return '<option>' + s + '</option>'; }).join("") + '</select></div>' +
      '<div class="fld"><label>Montant contrat (€/an)</label><input class="champ" id="c-mnt" inputmode="numeric"></div>' +
      '<div class="fld" style="align-self:end"><button class="btn primaire" id="c-add">Enregistrer</button></div></div>' +
      '<div class="tblwrap"><table class="reg"><thead><tr><th>Société</th><th>Statut</th><th>Montant</th><th></th></tr></thead><tbody id="crmbody">' +
      (rows || '<tr><td colspan="4" class="vide">Aucune entrée pour le moment.</td></tr>') + '</tbody></table></div></div>';
  }
  function bindCRM() {
    var add = document.getElementById("c-add"); if (!add) return;
    add.onclick = function () {
      var soc = document.getElementById("c-soc").value.trim();
      if (!soc) { toast("Renseigne au moins la société."); return; }
      S.crm.push({ societe: soc, statut: document.getElementById("c-stat").value, montant: document.getElementById("c-mnt").value.trim() });
      save(); toast("Entrée enregistrée"); renderMessages();
    };
    Array.prototype.forEach.call(main.querySelectorAll("[data-del]"), function (b) {
      b.onclick = function () { S.crm.splice(+b.dataset.del, 1); save(); renderMessages(); };
    });
  }

  // Pilotage
  function renderPilotage() {
    var actifs = AOS.filter(function (a) { return verdictEff(a) === "PERTINENT"; });
    var kpi = [
      ["Avis en base", AOS.length],
      ["Retenus (pertinents)", actifs.length],
      ["Chauds", actifs.filter(function (a) { return a.prio === "chaud"; }).length],
      ["Acheteurs publics", actifs.filter(function (a) { return a.buyer === "public"; }).length],
      ["Acheteurs privé-droit", actifs.filter(function (a) { return a.buyer === "prive"; }).length],
      ["Marchés de personnel", actifs.filter(function (a) { return a.perso; }).length],
      ["Via BOAMP", actifs.filter(function (a) { return a.source === "BOAMP"; }).length],
      ["Via Maximilien", actifs.filter(function (a) { return a.source === "Maximilien"; }).length],
      ["Via JOUE / TED", actifs.filter(function (a) { return a.source === "JOUE"; }).length]
    ];
    main.innerHTML = '<div class="page actif"><p class="kicker">Indicateurs</p><h1>Pilotage</h1>' +
      '<p class="intro">Indicateurs calculés sur les avis affichés, corrections comprises. Dans l\'application Python, ces chiffres viennent de la base locale du poste.</p>' +
      '<dl class="kpis">' + kpi.map(function (k) { return '<div><dt>' + k[0] + '</dt><dd>' + k[1] + '</dd></div>'; }).join("") + '</dl></div>';
  }

  // Réglages
  function renderReglages() {
    var r = S.reglages;
    function swrow(cle, lib, aide, onLib, offLib) {
      var on = !!r[cle];
      return '<div class="switch-row"><div class="lib">' + lib + '<small>' + aide + '</small></div>' +
        '<div style="display:flex;align-items:center;gap:14px"><span class="' + (on ? "etat-oui" : "etat-non") + '">' + (on ? onLib : offLib) + '</span>' +
        '<button class="btn" data-sw="' + cle + '">' + (on ? "Désactiver" : "Activer") + '</button></div></div>';
    }
    main.innerHTML = '<div class="page actif"><p class="kicker">Source unique · vue depuis la plateforme</p><h1>Réglages</h1>' +
      '<p class="intro">Modifié ici, appliqué partout dans l\'application Python. Ici les changements sont mémorisés dans le navigateur.</p>' +
      '<div class="section"><h2>Destinataires des alertes</h2><p class="aide">Une adresse par ligne. Les alertes email partent vers ces adresses.</p>' +
      '<textarea class="champ" id="dest" rows="4">' + esc(r.destinataires.join("\n")) + '</textarea>' +
      '<div style="margin-top:10px"><button class="btn primaire" id="dest-save">Enregistrer les destinataires</button></div></div>' +
      '<div class="section"><h2>Interrupteurs</h2>' +
      swrow("notifications", "Notifications", "Les emails d'alerte partent-ils ?", "actives", "suspendues") +
      swrow("collecte", "Collecte", "Les sources sont-elles interrogées ?", "active", "suspendue") +
      swrow("rh", "Marchés de personnel", "Prendre en compte les marchés de mise à disposition de personnel", "pris en compte", "ignorés") +
      '</div>' +
      '<div class="section"><h2>Fiche CHRUTH</h2><p class="aide">Alimente la rédaction des messages et le prompt de tri. Laisser vide plutôt qu\'approximer.</p>' +
      '<textarea class="champ" id="fiche" rows="5">' + esc(r.fiche) + '</textarea>' +
      '<div style="margin-top:10px"><button class="btn primaire" id="fiche-save">Enregistrer la fiche</button></div></div></div>';

    document.getElementById("dest-save").onclick = function () {
      r.destinataires = document.getElementById("dest").value.split("\n").map(function (s) { return s.trim(); }).filter(function (s) { return s && s.indexOf("@") >= 0; });
      save(); toast(r.destinataires.length + " destinataire(s) enregistré(s)"); renderReglages();
    };
    document.getElementById("fiche-save").onclick = function () { r.fiche = document.getElementById("fiche").value; save(); toast("Fiche enregistrée"); };
    Array.prototype.forEach.call(main.querySelectorAll("[data-sw]"), function (b) {
      b.onclick = function () { r[b.dataset.sw] = !r[b.dataset.sw]; save(); renderReglages(); };
    });
  }

  // Collecte (simulée, honnête)
  function renderCollecte() {
    main.innerHTML = '<div class="page actif"><p class="kicker">Lancer une mise à jour</p><h1>Collecte</h1>' +
      '<p class="intro">Dans l\'application Python, ces boutons lancent la collecte réelle (BOAMP, Maximilien, <em>JOUE/TED</em>) et remplissent la base. Ici, la collecte est <b>simulée</b> — un fichier HTML seul n\'a pas accès aux sources.</p>' +
      '<div class="actions"><button class="btn primaire" data-col="ao">Collecter les appels d\'offres</button>' +
      '<button class="btn" data-col="prospects">Collecter les prospects</button>' +
      '<button class="btn" data-col="tout">Les deux</button></div>' +
      '<div class="log" id="log">Prêt. Sélectionne une collecte à simuler.</div></div>';
    Array.prototype.forEach.call(main.querySelectorAll("[data-col]"), function (b) {
      b.onclick = function () { simulerCollecte(b.dataset.col); };
    });
  }
  function simulerCollecte(quoi) {
    var log = document.getElementById("log");
    var lignes = quoi === "prospects"
      ? ["[simulation] Recherche Entreprises (data.gouv)…", "[simulation] 132 000 sociétés retraitées.", "[simulation] Carte régénérée."]
      : quoi === "tout"
      ? ["[simulation] BOAMP + Maximilien + JOUE…", "[simulation] 8 avis, 6 retenus, 2 rejetés.", "[simulation] Prospects retraités."]
      : ["[simulation] BOAMP…", "[simulation] Maximilien…", "[simulation] JOUE / TED…", "[simulation] 8 avis collectés, 6 retenus."];
    log.textContent = ""; var i = 0;
    (function step() {
      if (i >= lignes.length) { log.textContent += "\nTerminé (simulation). La collecte réelle se lance depuis l'application Python."; return; }
      log.textContent += (i ? "\n" : "") + lignes[i++]; setTimeout(step, 420);
    })();
  }

  // Acheteurs de la semaine
  var ACH = [
    { nom:"Mairie de Créteil", type:"public", sous:"Collectivité territoriale", cp:"94000", ville:"Créteil", dept:"94", eff:"250 à 499", nb:2, prio:"CHAUD",
      aos:[{o:"Nettoyage des locaux administratifs et vitrerie", d:"22.07", p:"CHAUD"}, {o:"Entretien des écoles", d:"24.07", p:"TIÈDE"}] },
    { nom:"Immobilière 3F", type:"prive", sous:"Bailleur social · ESH", cp:"93000", ville:"Bobigny", dept:"93", eff:"1000 à 1999", nb:1, prio:"CHAUD",
      aos:[{o:"Entretien des parties communes et remise en état", d:"21.07", p:"CHAUD"}] },
    { nom:"SEM d'aménagement des Hauts-de-Seine", type:"prive", sous:"Société d'économie mixte", cp:"92000", ville:"Nanterre", dept:"92", eff:"50 à 99", nb:1, prio:"TIÈDE",
      aos:[{o:"Propreté des espaces d'accueil et sanitaires", d:"16.07", p:"TIÈDE"}] }
  ];
  var achFiltre = "tous";
  function renderAcheteurs() {
    var vis = ACH.filter(function (a) { return achFiltre === "tous" || a.type === achFiltre; });
    var pub = vis.filter(function (a) { return a.type === "public"; }).length;
    var h = '<div class="page actif"><p class="kicker">Cibles chaudes · 7 derniers jours</p>' +
      '<h1>Acheteurs de la semaine</h1>' +
      '<p class="intro">Les organisations ayant publié un appel d\'offres de propreté pertinent dans les 7 derniers jours, classées <em>public / privé-droit</em> et enrichies (effectif, adresse). Remplace la prospection « toutes entreprises ».</p>' +
      '<div class="barre"><span class="tally"><b>' + vis.length + '</b> acheteurs · <span class="pub"><b>' + pub + '</b> publics</span> · <span class="prv"><b>' + (vis.length - pub) + '</b> privé-droit</span></span>' +
      '<span class="filtre" role="group" aria-label="Type">' +
        fbtnA("tous", "Tous") + fbtnA("public", "Public") + fbtnA("prive", "Privé-droit") + '</span></div><div class="registre">';
    vis.forEach(function (a) {
      h += '<article class="rec" data-buyer="' + a.type + '"><div class="prio ' + (a.prio === "CHAUD" ? "chaud" : "tiede") + '">' + a.prio + '<span class="sc">' + a.nb + ' AO</span></div>' +
        '<div><h3>' + a.nom + '</h3><p class="ach">' + a.cp + ' ' + a.ville + ' (' + a.dept + ') · effectif ' + a.eff + '</p>' +
        '<p class="ref">' + a.aos.map(function (x) { return '<span>' + x.o + ' — ' + x.d + ' · ' + x.p + '</span>'; }).join("") + '</p></div>' +
        '<div class="type ' + a.type + '"><span class="t">' + (a.type === "public" ? "Public" : "Privé-droit") + '</span><span class="sous">' + a.sous + '</span></div></article>';
    });
    h += '</div></div>';
    main.innerHTML = h;
    Array.prototype.forEach.call(main.querySelectorAll(".filtre button"), function (b) {
      b.onclick = function () { achFiltre = b.dataset.f; renderAcheteurs(); };
    });
  }
  function fbtnA(f, lib) { return '<button data-f="' + f + '" aria-pressed="' + (achFiltre === f) + '">' + lib + '</button>'; }

  function renderInfo(titre, corps) {
    main.innerHTML = '<div class="page actif"><p class="kicker">Information</p><h1>' + esc(titre) + '</h1>' +
      '<div class="note-page">' + corps + '</div></div>';
  }

  // Démarrage
  aller(S.page || "veille");
})();
</script>

</html>
